[project]
name = "data-analyst-agent"
version = "0.1.0"
description = "Autonomous data analysis agent with multi-provider LLM routing"
requires-python = ">=3.11,<3.12"
dependencies = [
    "openai>=1.60",
    "anthropic>=0.45",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "rich>=13.9",
    "sqlglot>=26.0",
    "pyyaml>=6.0",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm", "agent", "sandbox", "eval", "trace", "retrieval"]
